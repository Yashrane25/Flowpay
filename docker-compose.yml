services:
  mysql:
    image: mysql:8.0
    container_name: flowpay-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: flowpay_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - flowpay-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./flowpay_backend
      dockerfile: Dockerfile
    container_name: flowpay_backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  flowpay-mysql-data: