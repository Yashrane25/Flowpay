#Tells Spring Boot where your MySQL database is located.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/flowpay_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

flowpay.jwt.cookie-name=flowpay_jwt
flowpay.jwt.cookie-secure=false

flowpay.jwt.secret=${JWT_SECRET:local-dev-secret-not-for-production}
flowpay.jwt.expiration-ms=3600000

flowpay.ratelimit.capacity=10
flowpay.ratelimit.refill-tokens=10
flowpay.ratelimit.refill-duration-seconds=60

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest